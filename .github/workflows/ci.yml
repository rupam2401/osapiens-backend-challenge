name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    # Code-level gate: typecheck, lint, and unit/integration tests inside
    # the same node:24-alpine image used by the production Dockerfile.
    # Catches musl-specific issues (e.g. better-sqlite3 prebuilds) that
    # an Ubuntu runner would miss.
    test:
        runs-on: ubuntu-latest
        container: node:24-alpine
        steps:
            - name: Install git (required by actions/checkout in Alpine)
              run: apk add --no-cache git

            - uses: actions/checkout@v4

            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test

    # Image-level gate: builds the real Dockerfile and hits /health to
    # prove the multi-stage build, runtime deps, and entrypoint all work
    # end-to-end. Runs in parallel with `test`.
    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build image
              run: docker build -t osapiens-backend .

            - name: Run container
              run: docker run -d --name app -p 3000:3000 osapiens-backend

            - name: Wait for /health
              run: |
                  for i in $(seq 1 20); do
                      if curl -fsS http://localhost:3000/health; then
                          echo "healthy after $i attempts"
                          exit 0
                      fi
                      echo "attempt $i — waiting..."
                      sleep 2
                  done
                  echo "=== container logs ==="
                  docker logs app
                  exit 1

            - name: Cleanup
              if: always()
              run: docker rm -f app
