# A simpler workflow that just runs area + notification and produces a report.
# Useful for demonstrating the notification job alongside area calculation.

name: "report_workflow"
steps:
  - taskType: "polygonArea"
    stepNumber: 1

  - taskType: "notification"
    stepNumber: 2
    dependsOn: 1

  - taskType: "reportGeneration"
    stepNumber: 3
    dependsOn: 2
